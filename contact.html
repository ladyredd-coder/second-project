<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It'S A GiRl'S WoRlD! | Contact</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <h1>Jalisa Franklin</h1>
  </header>
  <main>
    <section>
      <h2>Contact Me</h2>
      <img class="photo" src="updated_bratz_image_for_website.jpg" alt="Four trendy fashion dolls standing together under pink neon text that reads It's A Girl's World!">
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Name" required>
        <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Email" required>
  <fieldset>
    <legend>How should I reply?</legend>
    <label><input type="radio" name="reply" value="email" checked> Email</label>
    <label><input type="radio" name="reply" value="phone"> Phone</label>
  </fieldset>
  <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Message" required></textarea>

      <button type="submit" class="btn">Send</button>
</form>
    </section>
    </main>
  <footer>
    <p>&copy; 2026 Jalisa Franklin</p>
  </footer>
</body>
</html>
